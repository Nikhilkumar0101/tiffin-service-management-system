<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — The Comfort Box</title>
  <meta name="description" content="Admin panel to manage plans, menus, and subscriber cancellations for Tiffin Service." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">🍱 The Comfort Box</a>
      <div class="ms-auto d-flex gap-2">
        <span class="navbar-text text-white" id="adminBadge"></span>
        <button class="btn btn-sm btn-outline-light" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">

    <div class="row g-3 mb-4" id="statsRow"></div>

    <ul class="nav nav-tabs mb-3" id="adminTabs">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#plansTab" type="button">Manage Plans</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#menuTab" type="button">Manage Menu</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#subsTab" type="button">Subscribers</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#usersTab" type="button">Users</button></li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="plansTab">
        <div class="row g-4">
          <div class="col-lg-4">
            <div class="card shadow-sm">
              <div class="card-header bg-white fw-semibold">Add / Update Plan</div>
              <div class="card-body">
                <form id="planForm" class="row g-3">
                  <input type="hidden" id="planId">
                  <div class="col-12">
                    <label class="form-label">Plan Name</label>
                    <input type="text" id="planName" class="form-control" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Price</label>
                    <input type="number" id="planPrice" class="form-control" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Duration</label>
                    <input type="text" id="planDuration" class="form-control" placeholder="7 Days / 30 Days" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Meal Type</label>
                    <input type="text" id="planMealType" class="form-control" placeholder="Lunch + Dinner">
                  </div>
                  <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea id="planDescription" class="form-control" rows="3"></textarea>
                  </div>
                  <div class="col-12 d-flex gap-2">
                    <button class="btn btn-dark flex-grow-1" type="submit">Save</button>
                    <button class="btn btn-outline-secondary" type="button" id="resetPlanBtn">Reset</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
          <div class="col-lg-8">
            <div class="card shadow-sm">
              <div class="card-header bg-white fw-semibold">All Plans</div>
              <div class="card-body table-responsive">
                <table class="table table-bordered align-middle">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Price</th>
                      <th>Duration</th>
                      <th>Type</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="plansTable"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="menuTab">
        <div class="row g-4">
          <div class="col-lg-4">
            <div class="card shadow-sm">
              <div class="card-header bg-white fw-semibold">Update Today's Menu</div>
              <div class="card-body">
                <form id="menuForm" class="row g-3">
                  <div class="col-12">
                    <label class="form-label">Date</label>
                    <input type="date" id="menuDate" class="form-control" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Lunch Items (comma separated)</label>
                    <textarea id="lunchItems" class="form-control" rows="3" required></textarea>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Dinner Items (comma separated)</label>
                    <textarea id="dinnerItems" class="form-control" rows="3" required></textarea>
                  </div>
                  <div class="col-12">
                    <button class="btn btn-dark w-100" type="submit">Save Menu</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
          <div class="col-lg-8">
            <div class="card shadow-sm">
              <div class="card-header bg-white fw-semibold">Current Menu</div>
              <div class="card-body" id="menuPreview"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="subsTab">
        <div class="card shadow-sm">
          <div class="card-header bg-white fw-semibold">All Subscribers</div>
          <div class="card-body table-responsive">
            <table class="table table-striped table-bordered align-middle">
              <thead>
                <tr>
                  <th>User</th>
                  <th>Email</th>
                  <th>Plan</th>
                  <th>Address</th>
                  <th>Status</th>
                  <th>Start</th>
                  <th>End</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="subsTable"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="usersTab">
        <div class="card shadow-sm">
          <div class="card-header bg-white fw-semibold d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span>All Registered Users <span class="badge badge-soft" id="usersCount">0</span></span>
            <input type="text" id="userSearch" class="form-control form-control-sm" style="max-width:260px;" placeholder="Search by name or email...">
          </div>
          <div class="card-body table-responsive">
            <table class="table table-striped table-bordered align-middle">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Address</th>
                  <th>Joined</th>
                  <th>Subscriptions (Active / Total)</th>
                </tr>
              </thead>
              <tbody id="usersTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ════ FIXED TOAST NOTIFICATION (always visible, no scrolling) ════ -->
  <div id="fixedToast" style="
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    z-index: 10000;
    max-width: 380px;
    min-width: 260px;
    display: none;
    animation: slideIn .25s ease;
  "></div>
  <style>
    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
